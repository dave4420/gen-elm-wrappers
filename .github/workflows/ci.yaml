on:
  push:
    branches-ignore:
      - "trunk"

jobs:
  tests:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Setup Go"
        uses: actions/setup-go@v4
        with:
          go-version-file: "./go.mod"
      - name: "Setup Node"
        uses: actions/setup-node@v3
        with:
          node-version-file: "./.nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test
